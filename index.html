<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Xantolo 2025 · Alebrijes · Desbloqueo 29/10/2025 21:36</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Montserrat:wght@300;400;600;800&family=Courgette&display=swap" rel="stylesheet">
<style>
:root{--bg1:#14051a;--bg2:#210b2e;--accent1:#ff7a00;--accent2:#9b4dff;--accent3:#00d1b2;--bone:#f5f2e9;--shadow:0 10px 30px rgba(0,0,0,.45)}
body{margin:0;min-height:100vh;color:var(--bone);background:radial-gradient(1200px 600px at 10% -10%,rgba(255,122,0,.08),transparent 60%),radial-gradient(1000px 800px at 90% 110%,rgba(155,77,255,.10),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));font-family:'Montserrat';overflow-x:hidden}
.papel{position:fixed;inset:0 auto auto 0;width:100%;height:120px;z-index:10;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 80px,rgba(255,255,255,.06) 80px 82px),linear-gradient(180deg,rgba(255,122,0,.85),rgba(255,46,130,.85));clip-path:polygon(0 0,100% 0,100% 70%,95% 85%,90% 70%,85% 85%,80% 70%,75% 85%,70% 70%,65% 85%,60% 70%,55% 85%,50% 70%,45% 85%,40% 70%,35% 85%,30% 70%,25% 85%,20% 70%,15% 85%,10% 70%,5% 85%,0 70%);box-shadow:var(--shadow)}
header{text-align:center;padding-top:140px;padding-bottom:20px}
.title{font-family:'Cinzel Decorative';font-weight:700;font-size:clamp(28px,5vw,56px)}
.subtitle{font-family:'Courgette';font-size:clamp(16px,3vw,26px)}
.alebrije{position:fixed;z-index:0;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35));opacity:.7}
.al-left{left:-80px;bottom:0;width:min(42vw,520px)}
.al-right{right:-40px;top:10vh;width:min(32vw,420px)}
.gate{position:relative;z-index:5;max-width:980px;margin:0 auto;padding:24px}
.card{border:1px solid rgba(255,255,255,.12);background:rgba(20,5,26,.6);backdrop-filter:blur(6px);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
.countdown{display:grid;grid-template-columns:repeat(4,minmax(70px,1fr));gap:14px;margin:22px auto;max-width:760px}
.unit{background:linear-gradient(180deg,rgba(155,77,255,.18),rgba(255,122,0,.14));border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px 12px;text-align:center}
.num{font-size:clamp(28px,6vw,64px);font-weight:800}
.lab{opacity:.9;font-size:12px;text-transform:uppercase}
.content{display:none;position:relative;z-index:3;max-width:980px;margin:22px auto 80px;padding:24px}
.panel{background:rgba(20,5,26,.55);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
pre.lyrics{white-space:pre-wrap;font-family:"Courgette";font-size:clamp(16px,2.6vw,22px);line-height:1.6;margin-top:18px}
footer{text-align:center;color:rgba(255,255,255,.7);padding:30px 10px 60px}
.flores{position:fixed;inset:0;pointer-events:none;z-index:1}
.flor{position:absolute;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#ffe38f,#ff7a00 60%,#c44f00);animation:flotar linear infinite;opacity:.8}
@keyframes flotar{from{transform:translateY(0) rotate(0)}to{transform:translateY(-120vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="papel"></div>
<div class="flores" id="flores"></div>
<header>
<h1 class="title">Xantolo 2025 · Alebrijes</h1>
<p class="subtitle">La página se abrirá al latir de las <strong>09:36 p. m.</strong> — <strong>29 de octubre de 2025</strong></p>
</header>
<main class="gate">
<section id="lock" class="card">
<h2 style="margin:0 0 8px 0;font-family:'Cinzel Decorative'">Cuenta regresiva</h2>
<div class="tz-hint">Horario objetivo fijo: <strong>29/10/2025, 21:36</strong> (América/México_City)</div>
<div class="countdown">
<div class="unit"><div class="num" id="d">—</div><div class="lab">Días</div></div>
<div class="unit"><div class="num" id="h">—</div><div class="lab">Horas</div></div>
<div class="unit"><div class="num" id="m">—</div><div class="lab">Min</div></div>
<div class="unit"><div class="num" id="s">—</div><div class="lab">Seg</div></div>
</div>
</section>
<section id="content" class="content">
<div class="panel">
<h2>“El latido de mi corazón” — Letra</h2>
<pre class="lyrics" id="lyrics"><!-- letra --></pre>
</div>
</section>
</main>
<footer><small>Zona: <span id="tzname"></span></small></footer>
<script>
(function(){
const $=id=>document.getElementById(id);
const d=$('d'),h=$('h'),m=$('m'),s=$('s');
const lock=$('lock'),content=$('content');
const tz=$('tzname');if(tz)tz.textContent=Intl.DateTimeFormat().resolvedOptions().timeZone;
const target=new Date('2025-10-29T21:36:00-06:00');
function update(){
const now=new Date();let diff=target-now;
if(diff<=0){
const letra=`Dirás que es raro\nLo que me pasó\nParece que anoche\nTe encontré en mis sueños\nLas palabras que dije\nSe volvieron canción\nVersos que tuyos son\nY el recuerdo nos dio\nUna melodía bella\nQue el alma tocó\nCon el ritmo que vibra\nEn nuestro interior\nAmor verdadero nos une por siempre\nEn el latido de mi corazón\nAmor verdadero nos une por siempre\nEn el latido de mi corazón\nAy, mi familia\nOiga mi gente\nCanten a coro nuestra canción\nAmor verdadero, nos une por siempre\nEn el latido de mi corazón\nAy, mi familia\nOiga mi gente\nCanten a coro nuestra canción\nAmor verdadero nos une por siempre\nEn el latido de mi corazón`;
$('lyrics').textContent=letra;
lock.style.display='none';content.style.display='block';clearInterval(tick);return;}
const sec=Math.floor(diff/1000);
d.textContent=Math.floor(sec/86400);
h.textContent=String(Math.floor((sec%86400)/3600)).padStart(2,'0');
m.textContent=String(Math.floor((sec%3600)/60)).padStart(2,'0');
s.textContent=String(sec%60).padStart(2,'0');}
const tick=setInterval(update,1000);update();})();
</script>
</body>
</html>
